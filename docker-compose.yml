version: '3.9'

services:
  php:
    container_name: portalReclamacoes-php
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: always
    tty: true
    volumes:
      - ./:/var/www
      - ./docker/php/99-local.ini:/usr/local/etc/php/conf.d/99-local.ini
    networks:
      - portalReclamacoes-network
    ports:
      - '8011:9000'  # PHP-FPM

  nginx:
    container_name: portalReclamacoes-nginx
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    restart: always
    tty: true
    ports:
      - '1121:80'
      - '1132:443'
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - portalReclamacoes-network
    depends_on:
      - php

  mysql:
    container_name: portalReclamacoes-mysql
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    tty: true
    volumes:
      - portalReclamacoes-data:/var/lib/mysql/
      - ./docker/mysql/my.cnf:/etc/mysql/my.cnf
    networks:
      - portalReclamacoes-network
    ports:
      - '3381:3306'
    environment:
      MYSQL_DATABASE: portal
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: user
      MYSQL_PASSWORD: nf@204

  phpmyadmin:
    container_name: portalReclamacoes-phpmyadmin
    image: phpmyadmin:5.2
    restart: always
    ports:
      - '8823:80'
    networks:
      - portalReclamacoes-network
    environment:
      PMA_HOST: portalReclamacoes-mysql
    depends_on:
      - mysql

  redis:
    container_name: portalReclamacoes-redis
    build:
      context: ./docker/redis
      dockerfile: Dockerfile
    restart: always
    ports:
      - '6185:6379'
    networks:
      - portalReclamacoes-network
    volumes:
      - redis-data:/data

networks:
  portalReclamacoes-network:
    driver: bridge
  
volumes:
  portalReclamacoes-data:
    driver: local
  redis-data:
    driver: local
